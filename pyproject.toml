[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jpgen"
version = "0.4.0"
description = "Particle packing and DEM simulation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "h5py>=3.8,<4",
    "PyYAML>=6,<7",
    "scipy>=1.10,<2",
]

[project.scripts]
jpgen = "jpgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
