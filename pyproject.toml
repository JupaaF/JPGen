[build-system]
requires = ["setuptools>=77", "pybind11>=2.12,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "jpgen"
dynamic = ["version"]
description = "Particle packing and DEM simulation pipeline"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=1.24,<3",
    "h5py>=3.8,<4",
    "PyYAML>=6,<7",
    "textual>=8.2.8,<9",
    "scipy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/JupaaF/JPGen"
Source = "https://github.com/JupaaF/JPGen"
Issues = "https://github.com/JupaaF/JPGen/issues"

[project.scripts]
jpgen = "jpgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jpgen.__version__"}
