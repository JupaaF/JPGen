[build-system]
requires = ["setuptools>=77", "pybind11>=2.12,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "jpgen"
dynamic = ["version"]
description = "Particle packing and DEM simulation pipeline"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "h5py>=3.8,<4",
    "PyYAML>=6,<7",
    "questionary>=2.1.1,<3",
    "scipy>=1.10,<2",
]

[project.scripts]
jpgen = "jpgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jpgen.__version__"}
