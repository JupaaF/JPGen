# Run from the project root:
# source ./activate_kratos.sh
# jpgen examples/dem_cyclic_10000_phi063.yaml
# SI units. Pressure is isotropic contact stress, compression positive.
# Initial solid fraction is 0.63 BEFORE DEM consolidation; it changes under servo control.
# One cycle = 5 kPa -> 150 kPa -> 5 kPa, switching at measured pressure targets.
packing:
  sizing_method: variable_box_fraction
  count: 10000
  target_solid_fraction: 0.66
  exports: [vtk]
  box:
    origin: [0.0, 0.0, 0.0]
    # Aspect ratio only: variable_box_fraction scales the box to the target fraction.
    lengths: [1.0, 1.0, 1.0]
    periodic: true
  radii: {type: uniform, min: 0.003,max: 0.007}
  velocity: {type: constant, value: 0.0}
  angular_velocity: {type: constant, value: 0.0}
  placement:
    method: progressive_growth
    max_overlap: 0.05
    relax_all_overlaps: true
    max_iterations: 10000
    overlap_tolerance: 1.0e-05
    initial_scale: 0.25
    initial_increment: 0.05
    min_increment: 0.0001
    max_increment: 0.1
    max_stages: 200

dem:
  engine: kratos
  material:
    density: 2650.0
    young_modulus: 6.0e+8
    poisson_ratio: 0.3
  contact:
    model: hertz_viscous_coulomb
    static_friction: 0.4
    dynamic_friction: 0.4
    friction_decay: 500.0
    restitution: 0.5
  boundary: periodic
  gravity: [0.0, 0.0, 0.0]
  time_step: 1.0e-5
  backend_options:
    threads: 4
    # No wall-clock timeout for this large run. Each stage still has a physical time limit.
    timeout_seconds: null
  protocol:
    sample_every: 100
    stages:
      - name: consolidate_5kPa
        control:
          type: stress_servo
          mode: isotropic
          target_pressure: 5000.0
          max_velocity: 0.01
        until:
          observable: pressure
          op: near
          value: 5000.0
          rtol: 0.01
          hold_for: 0.001
        max_duration: 2.0

      - name: cycles_5_to_150kPa
        repeat: 50
        stages:
          - name: load_150kPa
            control:
              type: stress_servo
              mode: isotropic
              target_pressure: 150000.0
              max_velocity: 0.01
            until:
              observable: pressure
              op: near
              value: 150000.0
              rtol: 0.01
              hold_for: 0.001
            max_duration: 2.0

          - name: unload_5kPa
            control:
              type: stress_servo
              mode: isotropic
              target_pressure: 5000.0
              max_velocity: 0.01
            until:
              observable: pressure
              op: near
              value: 5000.0
              rtol: 0.01
              hold_for: 0.001
            max_duration: 2.0
