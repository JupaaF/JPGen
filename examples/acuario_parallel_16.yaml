# Caso corto para lanzar 16 ejecuciones independientes en Acuario.
# Cambia packing.seed en cada copia para obtener empaquetamientos distintos.
packing:
  sizing_method: fixed_count
  count: 32
  seed: 20260929
  box:
    origin_mode: minimum_corner
    lengths: [0.02, 0.02, 0.02]
    periodic: false
  radii: {type: constant, value: 0.001}
  placement:
    method: random_sequential
    max_overlap: 0.0

dem:
  engine: kratos
  backend_options:
    threads: 1
  material:
    density: 2500.0
    young_modulus: 10000000.0
    poisson_ratio: 0.25
  contact:
    model: hertz_viscous_coulomb
    static_friction: 0.5
    dynamic_friction: 0.4
    restitution: 0.8
  boundary: open
  gravity: [0.0, 0.0, -9.81]
  time_step: 0.000001
  end_time: 0.001
