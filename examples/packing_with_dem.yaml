# SI units. Activate the Kratos environment before running this example:
# jpgen examples/packing_with_dem.yaml
packing:
  sizing_method: variable_box_fraction
  count: 8000
  seed: 20260917
  exports: []
  box:
    origin: [0.0, 0.0, 0.0]
    lengths: [0.02, 0.02, 0.02]
    periodic: true
  radii: {type: constant, value: 0.005}
  velocity: {type: constant, value: 0.1}
  placement:
    method: progressive_growth
    max_overlap: 0.02
    relax_all_overlaps: true
    max_iterations: 10000
    overlap_tolerance: 1.0e-05
    initial_scale: 0.25
    initial_increment: 0.05
    min_increment: 0.0001
    max_increment: 0.1
    max_stages: 200
  target_solid_fraction: 0.6
dem:
  engine: kratos
  material:
    density: 2500.0
    young_modulus: 1.0e+7
    poisson_ratio: 0.25
  contact:
    model: hertz_viscous_coulomb
    static_friction: 0.5
    dynamic_friction: 0.4
    friction_decay: 500.0
    restitution: 0.8
  boundary: periodic
  gravity: [0.0, 0.0, 0.0]
  time_step: 1.0e-6
  end_time: 0.001
  backend_options:
    threads: 1
    timeout_seconds: 120.0
