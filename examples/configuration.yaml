packing:
  sizing_method: variable_box_fraction
  seed: 26914124982152444682029012717771560785
  box:
    origin:
    - 0.0
    - 0.0
    - 0.0
    lengths:
    - 0.1
    - 0.1
    - 0.1
    periodic: true
  radii:
    type: uniform
    min: 0.003
    max: 0.007
  restarts: 10
  max_particles: 1000000
  solid_fraction_tolerance: 0.0001
  velocity:
    type: constant
    value: 0.0
  angular_velocity:
    type: constant
    value: 0.0
  count: 10000
  target_solid_fraction: 0.58
  placement:
    method: progressive_growth
    max_overlap: 0.01
    relax_all_overlaps: true
    max_iterations: 10000
    overlap_tolerance: 1.0e-05
    initial_scale: 0.25
    initial_increment: 0.05
    min_increment: 0.0001
    max_increment: 0.1
