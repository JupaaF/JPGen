  exports:
  - vtk
dem:
  engine: kratos
  backend_options:
    python: /home/jpfernandez/Documentos/JPGen/.venv/bin/python
    installation: null
    threads: 1
    timeout_seconds: null
  material:
    density: 2650.0
    young_modulus: 600000000.0
    poisson_ratio: 0.3
  contact:
    static_friction: 0.4
    dynamic_friction: 0.4
    friction_decay: 500.0
    restitution: 0.5
    model: hertz_viscous_coulomb
  integration:
    translation: symplectic_euler
    rotation: direct
  boundary: periodic
  gravity:
  - 0.0
  - 0.0
  - 0.0
  time_step: 1.0e-06
  protocol:
    stages:
    - name: relaxation
      control:
        type: stress_servo
        mode: isotropic
        max_velocity: 0.1
        target_pressure: 5000.0
      until:
        all:
        - observable: pressure
          op: near
          value: 5000.0
          atol: 1.0e-06
          rtol: 0.01
        - observable: kinetic_energy
          op: below
          value: 1.0e-07
        - observable: unbalanced_force
          op: below
          value: 0.0001
        hold_for: 0.001
        min_duration: 0.0
      max_duration: 2.0
    - name: Loading
      control:
        type: stress_servo
        mode: isotropic
        max_velocity: 0.1
        target_pressure:
          type: ramp
          start: 5000.0
          end: 200000.0
          duration: 1.0
      until:
        all:
        - observable: kinetic_energy
          op: below
          value: 1.0e-07
        - observable: unbalanced_force
          op: below
          value: 0.0001
        - observable: pressure
          op: above
          value: 200000.0
        hold_for: 0.0
        min_duration: 0.0
      max_duration: 30.0
    sample_every: 100
