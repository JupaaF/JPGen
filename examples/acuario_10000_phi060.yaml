# Caso denso para medir consumo de memoria en Acuario.
# variable_box_fraction conserva exactamente 10 000 partículas y ajusta la caja
# para una fracción sólida nominal de 0,60.
packing:
  sizing_method: variable_box_fraction
  count: 10000
  # Fracción nominal: los volúmenes de partículas solapadas se cuentan completos.
  target_solid_fraction: 0.6
  solid_fraction_tolerance: 0.001
  seed: 20260929
  restarts: 0
  box:
    origin_mode: minimum_corner
    lengths: [0.05, 0.05, 0.05]
    periodic: true
  radii: {type: constant, value: 0.001}
  placement:
    method: progressive_growth
    max_overlap: 0.05
    relax_all_overlaps: false

dem:
  engine: kratos
  backend_options:
    threads: 1
  material:
    density: 2500.0
    young_modulus: 10000000.0
    poisson_ratio: 0.25
  contact:
    model: hertz_viscous_coulomb
    static_friction: 0.5
    dynamic_friction: 0.4
    restitution: 0.8
  boundary: periodic
  gravity: [0.0, 0.0, -9.81]
  time_step: 0.000001
  end_time: 0.0001
