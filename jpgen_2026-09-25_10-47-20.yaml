packing:
  sizing_method: variable_box_fraction
  seed: 321024927285315538190089668492875033601
  box:
    origin_mode: center
    lengths:
    - 0.1
    - 0.1
    - 0.1
    periodic: true
  radii:
    type: uniform
    min: 0.003
    max: 0.007
  restarts: 10
  max_particles: 1000000
  solid_fraction_tolerance: 0.001
  velocity:
    type: constant
    value: 0.0
  angular_velocity:
    type: constant
    value: 0.0
  count: 10000
  target_solid_fraction: 0.50
  placement:
    method: random_sequential
    max_overlap: 1.0
    position_attempts: 1000
  exports:
  - vtk
dem:
  engine: kratos
  backend_options:
    python: /home/jpfernandez/Documentos/JPGen/.venv/bin/python
    installation:
    threads: 4
    timeout_seconds:
  material:
    density: 2650.0
    young_modulus: 600000000.0
    poisson_ratio: 0.3
  contact:
    static_friction: 0.4
    dynamic_friction: 0.4
    friction_decay: 500.0
    restitution: 0.5
    model: hertz_viscous_coulomb
  integration:
    translation: symplectic_euler
    rotation: direct
  boundary: periodic
  gravity:
  - 0.0
  - 0.0
  - 0.0
  time_step: 1.0e-05
  protocol:
    stages:
    - name: Unload5kPa
      control:
        type: free_evolution
      until:
        observable: pressure
        op: below
        value: 5000.0
        hold_for: 0.0
        min_duration: 0.0
      max_duration: 1.0
    - name: 5kto200kPa
      path:
        observable: pressure
        targets:
          start: 5000.0
          end: 200000.0
          intermediate_states: 20
          spacing: log
        control:
          type: stress_servo
          mode: anisotropic
          stress_ratios:
          - 1.0
          - 1.0
          - 1.0
          max_velocity: 0.1
          loading_factor: 0.8
          update_every_steps: 1
        acceptance:
          target_rtol: 0.01
          kinetic_energy_below: 0.0001
          unbalanced_force_below: 0.01
          hold_for: 0.001
        max_duration_per_target: 1.0
    sample_every: 100
